components:
  schemas:
    AIChatReqRequest:
      type: object
      properties:
        message:
          type: string
          minLength: 1
        conversation_context:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - message
    AIChatRes:
      type: object
      properties:
        text:
          type: string
        products:
          type: array
          items:
            type: object
            additionalProperties: {}
        suggestions:
          type: array
          items:
            type: string
        intent:
          type: object
          additionalProperties: {}
      required:
      - intent
      - products
      - suggestions
      - text
    AIImageReqRequest:
      type: object
      properties:
        image:
          type: string
          format: binary
      required:
      - image
    AIImageRes:
      type: object
      properties:
        description:
          type: string
        products:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - description
      - products
    AccountDeleteReqRequest:
      type: object
      properties:
        password:
          type: string
          minLength: 1
      required:
      - password
    AccountDeleteRes:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
      - message
      - success
    AccountDeletionEligibilityRes:
      type: object
      properties:
        eligible:
          type: boolean
        message:
          type: string
        is_vendor:
          type: boolean
        error_code:
          type: string
      required:
      - eligible
      - is_vendor
      - message
    ActionEnum:
      enum:
      - suspend
      - activate
      type: string
      description: |-
        * `suspend` - suspend
        * `activate` - activate
    AdminActionLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        admin_name:
          type: string
          readOnly: true
        action:
          type: string
          maxLength: 255
        resource_type:
          type: string
          maxLength: 100
        resource_id:
          type: string
          format: uuid
          nullable: true
        details: {}
        ip_address:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        target_type:
          type: string
          nullable: true
          maxLength: 100
        target_id:
          type: string
          format: uuid
          nullable: true
        old_values:
          nullable: true
        new_values:
          nullable: true
        severity:
          $ref: '#/components/schemas/SeverityEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        admin:
          type: string
          format: uuid
      required:
      - action
      - admin
      - admin_name
      - created_at
      - id
      - resource_type
    AdminLoginResponse:
      type: object
      properties:
        message:
          type: string
        user:
          type: object
          additionalProperties: {}
        session:
          type: object
          additionalProperties: {}
      required:
      - message
      - session
      - user
    AdminRecentActivityResponse:
      type: object
      properties:
        recent_orders:
          type: array
          items:
            type: object
            additionalProperties: {}
        recent_signups:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - recent_orders
      - recent_signups
    AdminRevenueChartResponse:
      type: object
      properties:
        trend:
          type: array
          items:
            type: object
            additionalProperties: {}
        period:
          type: string
      required:
      - period
      - trend
    AdminStatsResponse:
      type: object
      properties:
        total_users:
          type: integer
        total_vendors:
          type: integer
        total_orders:
          type: integer
        pending_vendors:
          type: integer
        total_revenue:
          type: number
          format: double
        pending_payouts:
          type: number
          format: double
      required:
      - pending_payouts
      - pending_vendors
      - total_orders
      - total_revenue
      - total_users
      - total_vendors
    AdminUser:
      type: object
      properties:
